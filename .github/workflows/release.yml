name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          name="synchilas-ambilight-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp manifest.json frame.js README.md "$name"/
          zip -r "$name.zip" "$name"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "synchilas-ambilight-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
